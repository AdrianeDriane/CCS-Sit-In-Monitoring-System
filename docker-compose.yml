services:
  postgres:
    image: postgres:16-alpine
    container_name: ccs-sitin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccs_sitin_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccs_sitin_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: ccs-sitin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ccs_sitin_monitoring
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      CLIENT_ORIGIN: "*"
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    networks:
      - app_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: ccs-sitin-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    networks:
      - app_network

volumes:
  postgres_data:
  server_node_modules:
  client_node_modules:

networks:
  app_network:
